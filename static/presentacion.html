  style:{kind:'mini',topic:'Distinguir los estilos',q:'Un compañero te encarga una tarea cuando ya estás sobrecargado. ¿Cuál es una respuesta asertiva?',a:['«Bueno…», aunque no puedas cumplirla.','«No molestes, ese no es mi problema».','«Hoy no puedo asumirla; conversemos cómo reorganizarla».','«Haz lo que quieras; no me importa».'],c:2,why:'Una respuesta asertiva expresa un límite propio de manera clara y respetuosa, sin agredir ni aceptar algo inviable.'},
  clarity:{kind:'mini',topic:'Claridad',q:'Para coordinar el trabajo, ¿qué mensaje reduce más la ambigüedad?',a:['«Mándame eso más tarde».','«Necesito el reporte de ventas hoy antes de las 4 p. m., por favor».','«Ya sabes qué debes hacer».','«Todo tiene que quedar bien».'],c:1,why:'La petición concreta identifica el entregable y el plazo; así la otra persona puede comprobar qué se necesita.'},
  listen:{kind:'mini',topic:'Escucha activa',q:'Una colega comenta que le cuesta trabajar con indicaciones cambiantes. ¿Qué respuesta demuestra escucha activa?',a:['«Eso le pasa a todos; acostúmbrate».','«No tengo tiempo para escucharte».','«Yo también sufrí algo parecido, pero peor».','«Entiendo que sea confuso. ¿Qué indicación cambió?».'],c:3,why:'Reconoce la dificultad y formula una pregunta aclaratoria, sin minimizar la experiencia de la otra persona.'},
  barrier:{kind:'mini',topic:'Barreras comunicativas',q:'Durante una explicación, revisas tu celular e interrumpes varias veces. ¿Qué está ocurriendo?',a:['Estás haciendo una verificación del mensaje.','Aparecen barreras de distracción e interrupción.','Se fortalece la empatía del equipo.','Estás practicando una escucha reflexiva.'],c:1,why:'Atención dividida e interrupciones cortan el mensaje y dificultan comprender palabras, intención y emoción.'},
  q1:{kind:'final',topic:'Estilos comunicativos',q:'Te asignan trabajo adicional al final de tu turno. ¿Qué respondes?',a:['«Hoy no puedo extenderme; revisemos prioridades para mañana».','«Está bien», aunque luego no puedas hacerlo.','«No me fastidien con eso».','«Si ustedes quieren, hagan lo que sea».'],c:0,why:'Expresar un límite y proponer una alternativa concreta permite cuidar la tarea y mantener el respeto.'},
  q2:{kind:'final',topic:'Escucha activa',q:'Tu compañero explica una preocupación. ¿Cómo confirmas que lo entendiste?',a:['Le das consejos antes de que termine.','Cambias de tema para aliviarlo.','Resumes lo que expresó y preguntas si comprendiste bien.','Le dices que está exagerando.'],c:2,why:'Parafrasear y verificar la comprensión demuestra atención y evita interpretar por cuenta propia.'},
  q3:{kind:'final',topic:'Barreras',q:'¿Cuál de estos hábitos suele dificultar el intercambio de información?',a:['Hacer preguntas concretas.','Escuchar sin interrumpir.','Dar instrucciones específicas.','Suponer intenciones sin preguntar.'],c:3,why:'Juzgar o asumir sin verificar introduce interpretaciones erróneas y puede causar conflictos.'},
  q4:{kind:'final',topic:'Desacuerdos',q:'No compartes una decisión del equipo. ¿Cómo expresas tu postura?',a:['«Esa idea es absurda».','«Comprendo la propuesta; me preocupa el plazo y sugiero revisarlo».','Guardas silencio y te quejas después.','«Ustedes nunca hacen nada bien».'],c:1,why:'Una discrepancia asertiva reconoce la propuesta, explica la preocupación y plantea una alternativa sin descalificar.'},

function questionHTML(id){const q=QUESTIONS[id],picked=answers[id],done=picked!==undefined,good=picked===q.c,quiz=q.kind==='final';const total=['q1','q2','q3','q4','q5','q6'].indexOf(id);return `<div class="quiz-kicker">${quiz?`QUIZ FINAL · CASO ${total+1} DE 6`:'PREGUNTA RELÁMPAGO'} · ${esc(q.topic.toUpperCase())}</div><h1 class="question-title">${esc(q.q)}</h1><div class="question-options">${q.a.map((ans,i)=>`<button class="answer ${done?(i===q.c?'correct':picked===i?'wrong':'dim'):''}" ${done?'disabled':''} onclick="respond('${id}',${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(ans)}</span></button>`).join('')}</div>${done?`<div class="explanation ${good?'':'bad'}"><div class="ex-text"><h3>${good?'✓ Muy bien, esa respuesta ayuda.':'↻ Veamos una alternativa más adecuada.'}</h3><p>${esc(q.why)} <b>Respuesta más adecuada:</b> ${esc(q.a[q.c])}</p></div>${btn('CONTINUAR →','next()','dark')}</div>`:`<div style="margin-top:14px;font-weight:800;opacity:.75;font-size:clamp(12px,1.13cqw,16px)">Elige una alternativa y descubre por qué funciona.</div>`}${quiz?`<div class="quiz-section">${Array.from({length:6},(_,i)=>`<span class="${i<total?'done':i===total?'on':''}"></span>`).join('')}</div>`:''}`}
function render(){visited.add(index);const s=SCENES[index];stage.className=`slide theme-${s.theme}`;stage.innerHTML=(s.qid?questionHTML(s.qid):s.html())+`<div class="scene-no">${String(index+1).padStart(2,'0')} / ${SCENES.length}</div>`;document.getElementById('progress').style.width=`${(index+1)/SCENES.length*100}%`;document.getElementById('locator').textContent=`${String(index+1).padStart(2,'0')} / ${SCENES.length}  ·  ${s.special||'SESIÓN'}`;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===SCENES.length-1;stage.scrollTop=0}
function stopTimer(){if(timer)clearInterval(timer);timer=null;timerRunning=false}
function jump(i){
  if(i<0||i>=SCENES.length||i===index)return;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const deck=document.getElementById('deck');
  const backwards=i<index;
  // Clean previous animation immediately if the facilitator navigates quickly.
  if(turnCleanup){turnCleanup();turnCleanup=null}
  let old=null;
  if(!reduced){
    old=stage.cloneNode(true);
    old.removeAttribute('id');old.setAttribute('aria-hidden','true');
    old.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
    old.querySelectorAll('[tabindex]').forEach(el=>el.setAttribute('tabindex','-1'));
    old.classList.add('page-exit');
    if(backwards)old.classList.add('backwards');
    deck.appendChild(old);
  }
  stopTimer();timerSeconds=0;index=i;render();
  if(pageSoundOn)sound('page');
  if(!reduced){
    stage.classList.add('page-enter');
    if(backwards)stage.classList.add('backwards');
    deck.classList.add('is-turning');
    deck.classList.toggle('backwards',backwards);
    let job;
    const cleanup=()=>{
      if(job)clearTimeout(job);
      old?.remove();
      stage.classList.remove('page-enter','backwards');
      deck.classList.remove('is-turning','backwards');
      if(turnCleanup===cleanup)turnCleanup=null;
    };
    turnCleanup=cleanup;
    job=setTimeout(cleanup,680);
  }
}
function next(){jump(index+1)}function previous(){jump(index-1)}
function respond(id,choice){if(answers[id]!==undefined)return;answers[id]=choice;render();const correct=choice===QUESTIONS[id].c;sound(correct?'ok':'no');if(correct)confetti()}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<23;i++){const c=document.createElement('i');c.className='confetti';c.style.cssText=`left:${25+Math.random()*50}vw;top:${20+Math.random()*42}vh;--x:${(Math.random()-.5)*500}px;--y:${140+Math.random()*280}px;background:${['#d34a3c','#24658b','#f5bf43','#257b65'][i%4]}`;document.body.appendChild(c);setTimeout(()=>c.remove(),1100)}}
function repeatQuiz(){['q1','q2','q3','q4','q5','q6'].forEach(k=>delete answers[k]);jump(21)}
function clarityMove(value){let n=Number(value),labels=['NIVEL 1 · AMBIGUO','NIVEL 2 · MÁS CLARO','NIVEL 3 · PRECISO'];const msgs=['“Mándame eso luego”.','“Envíame el informe de ventas hoy”.','“¿Puedes enviarme el informe de ventas hoy antes de las 4 p. m.? Confírmame si puedes”.'];const hints=['No especifica qué se necesita ni cuándo.','Ya sabemos qué documento se necesita, pero falta una hora concreta.','Especifica el entregable, el plazo y comprueba que el acuerdo es posible.'];document.getElementById('clarity-label').textContent=labels[n];document.getElementById('clarity-message').textContent=msgs[n];document.getElementById('clarity-hint').textContent=hints[n]}
function showBarrier(n){const results=['Apartar el celular, elegir un momento tranquilo y prestar atención.','Escuchar hasta el final y preguntar antes de responder.','Comprobar los hechos antes de atribuir intenciones.','Sustituir la ironía por una petición directa y respetuosa.'];document.querySelectorAll('.barrier').forEach((el,i)=>el.classList.toggle('on',i===n));document.getElementById('barrier-result').textContent='✦ '+results[n]}
function traffic(n){const steps=[['1 · ALTO','Reconoce el impulso. Evita responder en caliente.'],['2 · PIENSA','Respira. Distingue lo que pasó de lo que interpretaste.'],['3 · RESPONDE','Expresa lo que necesitas con firmeza y respeto.']];document.querySelectorAll('.traffic-lamp').forEach((el,i)=>el.classList.toggle('on',i===n));document.querySelectorAll('.traffic-controls button').forEach((el,i)=>el.classList.toggle('on',i===n));document.getElementById('traffic-title').textContent=steps[n][0];document.getElementById('traffic-sub').textContent=steps[n][1]}
const formatTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function paintTime(){const el=document.getElementById('clock');if(el)el.textContent=formatTime(timerSeconds)}
function startTimer(minutes){if(timerRunning)return;if(timerSeconds===0)timerSeconds=minutes*60;timerRunning=true;document.getElementById('startclock').textContent='▶ EN MARCHA';timer=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);paintTime();if(timerSeconds===0){stopTimer();sound('end');const btn=document.getElementById('startclock');if(btn)btn.textContent='✓ TERMINÓ'}},1000)}
function pauseTimer(){stopTimer();const b=document.getElementById('startclock');if(b)b.textContent='▶ CONTINUAR'}
function resetTimer(minutes){stopTimer();timerSeconds=minutes*60;paintTime();const b=document.getElementById('startclock');if(b)b.textContent='▶ INICIAR'}
function openIndex(){const listing=document.getElementById('indexList');listing.innerHTML=entries.map((e,i)=>`<button class="${i===index?'active':''}" onclick="jump(${i});closeIndex()"><small>${String(i+1).padStart(2,'0')} · ${e[1]}</small>${e[0]}</button>`).join('');document.getElementById('indexOverlay').classList.add('show')}
function closeIndex(){document.getElementById('indexOverlay').classList.remove('show')}
function openNotes(){const e=entries[index];document.getElementById('noteContent').innerHTML=`<div class="smallcaps">DIAPOSITIVA ${index+1} · ${esc(e[1])}</div><h3 style="font-size:28px;margin:10px 0 18px">${esc(e[0])}</h3><p class="hint">${esc(e[2])}</p><p style="font-size:15px;color:#666">Esta guía aparece solo al pulsar el botón y puede cerrarse antes de continuar la exposición.</p>`;document.getElementById('speakerOverlay').classList.add('show')}
function closeNotes(){document.getElementById('speakerOverlay').classList.remove('show')}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='Escape'){closeNotes();closeIndex();return}if(document.querySelector('.index-overlay.show,.speaker-overlay.show'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();previous()}else if(e.key.toLowerCase()==='m'){jump(0)}else if(e.key.toLowerCase()==='i'){openIndex()}else if(e.key.toLowerCase()==='g'){openNotes()}else if(e.key.toLowerCase()==='f'){fullscreen()}});
render();
</script></body></html>
